# golangci-lint configuration. See techdocs/coding_standards_techdoc.md §12.
run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - bodyclose
    - noctx

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
