<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- No script at all in Stage 1 — the card is static. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>Sales Copilot Overlay</title>
    <style>
      /* The window is transparent — only the card below is visible. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      .card {
        /* Frameless window: the card itself is the drag handle (7.3). */
        -webkit-app-region: drag;
        user-select: none;
        cursor: default;
        box-sizing: border-box;
        height: 100%;
        background: rgba(24, 25, 30, 0.92);
        border: 1px solid #34353c;
        border-radius: 12px;
        padding: 14px 16px;
        color: #e8e8ea;
      }
      .title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4cc38a;
      }
      .hint {
        margin-top: 8px;
        font-size: 12px;
        color: #9a9aa3;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title"><span class="dot"></span>Sales Copilot</div>
      <p class="hint">
        Suggestion cards will appear here (Stage 7). This window stays on top
        and is excluded from screen sharing.
      </p>
    </div>
  </body>
</html>
