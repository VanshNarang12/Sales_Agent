<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- CSP: page may only run its own script and open WebSockets — nothing else. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src ws: wss:"
    />
    <title>Sales Copilot</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #1e1f24;
        color: #e8e8ea;
        margin: 0;
        padding: 16px 18px;
        font-size: 13px;
        user-select: none;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 14px;
      }
      label {
        display: block;
        color: #9a9aa3;
        margin-bottom: 4px;
      }
      select {
        width: 100%;
        padding: 6px;
        background: #2a2b31;
        color: #e8e8ea;
        border: 1px solid #3a3b42;
        border-radius: 6px;
        margin-bottom: 14px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }
      button {
        flex: 1;
        padding: 8px 0;
        border: none;
        border-radius: 6px;
        background: #3563e9;
        color: white;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled {
        background: #3a3b42;
        color: #77777f;
        cursor: default;
      }
      #pauseBtn {
        background: #8a5a00;
      }
      #pauseBtn:disabled {
        background: #3a3b42;
      }
      .status {
        margin: 0 0 14px;
        color: #9a9aa3;
      }
      /* status colors set by control.ts via className */
      .st-idle { color: #9a9aa3; }
      .st-connecting { color: #d9b13b; }
      .st-streaming { color: #4cc38a; }
      .st-paused { color: #e0a93e; }
      .st-reconnecting { color: #e5484d; }
      .st-closed { color: #9a9aa3; }
      .counters {
        display: flex;
        gap: 18px;
        border-top: 1px solid #2e2f36;
        padding-top: 12px;
      }
      .counters span {
        display: block;
        font-size: 16px;
        font-weight: 600;
      }
      .counters label {
        margin: 2px 0 0;
      }
    </style>
  </head>
  <body>
    <h1>Sales Copilot — capture</h1>

    <label for="deviceSelect">Microphone</label>
    <select id="deviceSelect"></select>

    <div class="row">
      <button id="connectBtn">Connect</button>
      <button id="pauseBtn" disabled>Pause</button>
    </div>

    <p class="status">Status: <span id="status" class="st-idle">idle</span></p>

    <div class="counters">
      <div><span id="framesSent">0</span><label>frames sent</label></div>
      <div><span id="framesDropped">0</span><label>dropped</label></div>
      <div><span id="reconnects">0</span><label>reconnects</label></div>
    </div>

    <script src="control.js"></script>
  </body>
</html>
